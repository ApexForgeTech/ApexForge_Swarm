<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Black background -->
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Central ellipse halo (purple-blue) -->
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3b1fa8" stop-opacity="0.55"/>
      <stop offset="45%"  stop-color="#1a0a6e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000033" stop-opacity="0"/>
    </radialGradient>

    <!-- Node glow filter -->
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Strong glow for center hex -->
    <filter id="hexGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Text glow -->
    <filter id="textGlow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- APEXFORGE gradient -->
    <linearGradient id="apexGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1565c0"/>
      <stop offset="40%"  stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>

    <!-- SWARM gradient -->
    <linearGradient id="swarmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>

    <!-- Ellipse halo for outer ring -->
    <filter id="outerGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Line glow -->
    <filter id="lineGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGlow)"/>

  <!-- Outer purple-blue ellipse halo -->
  <ellipse cx="250" cy="215" rx="220" ry="110"
           fill="url(#haloGrad)" opacity="0.9"/>
  <!-- Second inner halo ring -->
  <ellipse cx="250" cy="215" rx="155" ry="78"
           fill="none" stroke="#2a1580" stroke-width="1" opacity="0.4"
           filter="url(#outerGlow)"/>

  <!-- Outer orbit ellipse (stroke) -->
  <ellipse cx="250" cy="215" rx="215" ry="107"
           fill="none" stroke="#1a4fcc" stroke-width="0.8" opacity="0.5"
           filter="url(#outerGlow)"/>
  <!-- Inner orbit ellipse -->
  <ellipse cx="250" cy="215" rx="148" ry="74"
           fill="none" stroke="#0d3baa" stroke-width="0.6" opacity="0.4"/>

  <!-- ── Connection lines from nodes to center ── -->
  <g stroke="#00b4d8" stroke-width="0.6" opacity="0.35" filter="url(#lineGlow)">
    <!-- Top arc nodes to center -->
    <line x1="250" y1="215" x2="108" y2="190"/>
    <line x1="250" y1="215" x2="148" y2="145"/>
    <line x1="250" y1="215" x2="200" y2="120"/>
    <line x1="250" y1="215" x2="250" y2="110"/>
    <line x1="250" y1="215" x2="300" y2="120"/>
    <line x1="250" y1="215" x2="352" y2="145"/>
    <line x1="250" y1="215" x2="392" y2="190"/>
    <!-- Bottom arc nodes to center -->
    <line x1="250" y1="215" x2="108" y2="240"/>
    <line x1="250" y1="215" x2="148" y2="285"/>
    <line x1="250" y1="215" x2="200" y2="308"/>
    <line x1="250" y1="215" x2="300" y2="308"/>
    <line x1="250" y1="215" x2="352" y2="285"/>
    <line x1="250" y1="215" x2="392" y2="240"/>
    <!-- Far side nodes -->
    <line x1="250" y1="215" x2="38"  y2="215"/>
    <line x1="250" y1="215" x2="462" y2="215"/>
  </g>

  <!-- Lateral cross-connections between nodes -->
  <g stroke="#1a6fcc" stroke-width="0.5" opacity="0.25">
    <line x1="108" y1="190" x2="148" y2="145"/>
    <line x1="148" y1="145" x2="200" y2="120"/>
    <line x1="200" y1="120" x2="250" y2="110"/>
    <line x1="250" y1="110" x2="300" y2="120"/>
    <line x1="300" y1="120" x2="352" y2="145"/>
    <line x1="352" y1="145" x2="392" y2="190"/>
    <line x1="108" y1="240" x2="148" y2="285"/>
    <line x1="148" y1="285" x2="200" y2="308"/>
    <line x1="200" y1="308" x2="300" y2="308"/>
    <line x1="300" y1="308" x2="352" y2="285"/>
    <line x1="352" y1="285" x2="392" y2="240"/>
  </g>

  <!-- ── Orbit nodes ── -->
  <!-- Top arc -->
  <circle cx="250" cy="108" r="5"   fill="#00e5ff" filter="url(#nodeGlow)" opacity="0.95"/>
  <circle cx="200" cy="120" r="4"   fill="#00b4d8" filter="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="300" cy="120" r="4"   fill="#00b4d8" filter="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="148" cy="145" r="4.5" fill="#00cfff" filter="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="352" cy="145" r="4.5" fill="#00cfff" filter="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="108" cy="190" r="5.5" fill="#1a8fff" filter="url(#nodeGlow)" opacity="0.95"/>
  <circle cx="392" cy="190" r="5.5" fill="#1a8fff" filter="url(#nodeGlow)" opacity="0.95"/>
  <!-- Left & right tips -->
  <circle cx="37"  cy="215" r="6"   fill="#0077b6" filter="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="463" cy="215" r="6"   fill="#0077b6" filter="url(#nodeGlow)" opacity="0.9"/>
  <!-- Bottom arc -->
  <circle cx="108" cy="240" r="5.5" fill="#1a8fff" filter="url(#nodeGlow)" opacity="0.95"/>
  <circle cx="392" cy="240" r="5.5" fill="#1a8fff" filter="url(#nodeGlow)" opacity="0.95"/>
  <circle cx="148" cy="285" r="4.5" fill="#00cfff" filter="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="352" cy="285" r="4.5" fill="#00cfff" filter="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="200" cy="308" r="4"   fill="#00b4d8" filter="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="300" cy="308" r="4"   fill="#00b4d8" filter="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="250" cy="322" r="5"   fill="#00e5ff" filter="url(#nodeGlow)" opacity="0.95"/>

  <!-- Secondary smaller nodes on lines -->
  <circle cx="175" cy="168" r="2.5" fill="#4fc3f7" opacity="0.7"/>
  <circle cx="325" cy="168" r="2.5" fill="#4fc3f7" opacity="0.7"/>
  <circle cx="175" cy="262" r="2.5" fill="#4fc3f7" opacity="0.7"/>
  <circle cx="325" cy="262" r="2.5" fill="#4fc3f7" opacity="0.7"/>
  <circle cx="155" cy="215" r="2"   fill="#4fc3f7" opacity="0.6"/>
  <circle cx="345" cy="215" r="2"   fill="#4fc3f7" opacity="0.6"/>

  <!-- ── Central hexagon ── -->
  <!-- Outer glow ring -->
  <polygon points="250,168 275,183 275,213 250,228 225,213 225,183"
           fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.3"
           filter="url(#hexGlow)"/>
  <!-- Hex body -->
  <polygon points="250,175 272,188 272,212 250,225 228,212 228,188"
           fill="#040d2e" stroke="#00cfff" stroke-width="1.5"
           filter="url(#hexGlow)" opacity="0.95"/>
  <!-- Inner hex accent -->
  <polygon points="250,182 265,191 265,209 250,218 235,209 235,191"
           fill="none" stroke="#00b4d8" stroke-width="0.8" opacity="0.6"/>
  <!-- AI text -->
  <text x="250" y="206"
        font-family="'Arial', sans-serif" font-size="20" font-weight="900"
        text-anchor="middle" fill="#00e5ff"
        filter="url(#textGlow)">AI</text>

  <!-- Central pulse ring -->
  <circle cx="250" cy="200" r="35"
          fill="none" stroke="#00b4d8" stroke-width="0.5" opacity="0.2"/>
  <circle cx="250" cy="200" r="48"
          fill="none" stroke="#0066cc" stroke-width="0.4" opacity="0.15"/>

  <!-- ── APEXFORGE text ── -->
  <text x="250" y="378"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-size="52" font-weight="900"
        letter-spacing="2"
        text-anchor="middle"
        fill="url(#apexGrad)"
        filter="url(#textGlow)">APEXFORGE</text>

  <!-- · SWARM · -->
  <text x="196" y="403" font-family="'Arial', sans-serif" font-size="10"
        fill="#00b4d8" opacity="0.8">· · ·</text>
  <text x="250" y="404"
        font-family="'Arial', sans-serif" font-size="17" font-weight="700"
        letter-spacing="8" text-anchor="middle"
        fill="url(#swarmGrad)"
        filter="url(#textGlow)">SWARM</text>
  <text x="296" y="403" font-family="'Arial', sans-serif" font-size="10"
        fill="#00b4d8" opacity="0.8">· · ·</text>

  <!-- Tagline -->
  <text x="250" y="424"
        font-family="'Arial', sans-serif" font-size="9.5"
        letter-spacing="3.5" text-anchor="middle"
        fill="#1a6fcc" opacity="0.85">ORCHESTRATE. ADAPT. ASCEND.</text>

  <!-- Bottom small hexagon icon -->
  <polygon points="250,440 257,444 257,452 250,456 243,452 243,444"
           fill="none" stroke="#00b4d8" stroke-width="1" opacity="0.6"
           filter="url(#nodeGlow)"/>
  <circle cx="250" cy="448" r="2" fill="#00e5ff" opacity="0.7"/>
</svg>
